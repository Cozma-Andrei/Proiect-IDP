version: "3.8"

services:
  # ─── Frontend ──────────────────────────────────────────
  frontend:
    image: carelog-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: host
    command: npm run dev
    environment:
      - CHOKIDAR_USEPOLLING=true
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      placement:
        constraints:
          - node.role == manager
      labels:
        com.carelog.service_group: "frontend"
        com.carelog.priority: "medium"
    networks:
      frontend-net:

  # ─── Auth Service (port 5001) ──────────────────────────
  auth-service:
    image: carelog-auth-service:latest
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    ports:
      - 5001:5001
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh", "npm", "run", "dev"]
    environment:
      - NODE_ENV=DEV
      - PORT=5001
      - MONGO_URI=mongodb://auth-db:27017/careLog_auth
      - FRONTEND_URL=http://localhost:3000
      - RECORDS_SERVICE_URL=http://records-service:5003
    secrets:
      - JWT_SECRET
      - MAIL_USER
      - MAIL_PASS
    configs:
      - source: docker_entrypoint
        target: /docker-entrypoint.sh
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
      labels:
        com.carelog.service_group: "backend-auth"
    networks:
      frontend-net:
        aliases:
          - auth-service
      backend-net:
        aliases:
          - auth-service
      data-net:
        aliases:
          - auth-service

  # ─── Medical Service (port 5002) ───────────────────────
  medical-service:
    image: carelog-medical-service:latest
    build:
      context: ./medical-service
      dockerfile: Dockerfile
    ports:
      - 5002:5002
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh", "npm", "run", "dev"]
    environment:
      - NODE_ENV=DEV
      - PORT=5002
      - RECORDS_SERVICE_URL=http://records-service:5003
      - IO_SERVICE_URL=http://io-service:5004
      - AUTH_SERVICE_URL=http://auth-service:5001
    secrets:
      - JWT_SECRET
    configs:
      - source: docker_entrypoint
        target: /docker-entrypoint.sh
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
      labels:
        com.carelog.service_group: "backend-medical"
    networks:
      frontend-net:
        aliases:
          - medical-service
      backend-net:
        aliases:
          - medical-service

  # ─── Records Service (port 5003) ───────────────────────
  records-service:
    image: carelog-records-service:latest
    build:
      context: ./records-service
      dockerfile: Dockerfile
    ports:
      - 5003:5003
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh", "npm", "run", "dev"]
    environment:
      - NODE_ENV=DEV
      - PORT=5003
      - MONGO_URI=mongodb://medical-db:27017/careLog_medical
      - AUTH_MONGO_URI=mongodb://auth-db:27017/careLog_auth
      - IO_SERVICE_URL=http://io-service:5004
    configs:
      - source: docker_entrypoint
        target: /docker-entrypoint.sh
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
      labels:
        com.carelog.service_group: "backend-records"
    networks:
      backend-net:
        aliases:
          - records-service
      data-net:
        aliases:
          - records-service

  # ─── IO Service (port 5004) ────────────────────────────
  io-service:
    image: carelog-io-service:latest
    build:
      context: ./io-service
      dockerfile: Dockerfile
    ports:
      - 5004:5004
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh", "npm", "run", "dev"]
    environment:
      - NODE_ENV=DEV
      - PORT=5004
    secrets:
      - AWS_REGION
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_S3_BUCKET_NAME
    configs:
      - source: docker_entrypoint
        target: /docker-entrypoint.sh
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
      labels:
        com.carelog.service_group: "backend-io"
    networks:
      backend-net:
        aliases:
          - io-service

  # ─── Kong API Gateway ─────────────────────────────────
  kong:
    image: kong:latest
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
        mode: host
      - target: 8443
        published: 8443
        protocol: tcp
        mode: host
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/usr/local/kong/declarative/kong.yml
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_LISTEN=127.0.0.1:8001
    configs:
      - source: kong_config
        target: /usr/local/kong/declarative/kong.yml
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
      placement:
        constraints:
          - node.role == manager
      labels:
        com.carelog.role: "api-gateway"
    networks:
      frontend-net:
        aliases:
          - kong

  # ─── Portainer (Docker Management) ────────────────────
  portainer:
    image: portainer/portainer-ce:latest
    ports:
      - target: 9000
        published: 9000
        protocol: tcp
        mode: host
      - target: 9443
        published: 9443
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
      placement:
        constraints:
          - node.role == manager
      labels:
        com.carelog.role: "management"
    networks:
      frontend-net:

  # ─── Databases ─────────────────────────────────────────
  auth-db:
    image: mongo:latest
    ports:
      - 27018:27017
    volumes:
      - auth-dbdata:/data/db
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
        reservations:
          cpus: '0.50'
          memory: 512M
      placement:
        constraints:
          - node.role == manager
      labels:
        com.carelog.service_group: "data"
    networks:
      data-net:
        aliases:
          - auth-db

  medical-db:
    image: mongo:latest
    ports:
      - 27019:27017
    volumes:
      - medical-dbdata:/data/db
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
        reservations:
          cpus: '0.50'
          memory: 512M
      placement:
        constraints:
          - node.role == manager
      labels:
        com.carelog.service_group: "data"
    networks:
      data-net:
        aliases:
          - medical-db

networks:
  frontend-net:
    driver: overlay
    attachable: true
    driver_opts:
      com.docker.network.driver.mtu: 1400
  backend-net:
    driver: overlay
    attachable: true
    driver_opts:
      com.docker.network.driver.mtu: 1400
  data-net:
    driver: overlay
    attachable: true
    driver_opts:
      com.docker.network.driver.mtu: 1400

volumes:
  auth-dbdata:
  medical-dbdata:
  portainer_data:

secrets:
  JWT_SECRET:
    external: true
  MAIL_USER:
    external: true
  MAIL_PASS:
    external: true
  AWS_REGION:
    external: true
  AWS_ACCESS_KEY_ID:
    external: true
  AWS_SECRET_ACCESS_KEY:
    external: true
  AWS_S3_BUCKET_NAME:
    external: true

configs:
  docker_entrypoint:
    name: docker_entrypoint_${CONFIG_VERSION:-1}
    file: ./docker-entrypoint.sh
  kong_config:
    name: kong_config_${CONFIG_VERSION:-1}
    file: ./kong.yml
