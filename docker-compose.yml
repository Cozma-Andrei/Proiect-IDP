version: "3.8"

services:
  # ─── Frontend ──────────────────────────────────────────
  frontend:
    image: carelog-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: host
    command: npm run dev
    environment:
      - CHOKIDAR_USEPOLLING=true
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      carelog-net:
        aliases:
          - frontend

  # ─── Auth Service (port 5001) ──────────────────────────
  auth-service:
    image: carelog-auth-service:latest
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    ports:
      - 5001:5001
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh", "npm", "run", "dev"]
    environment:
      - NODE_ENV=DEV
      - PORT=5001
      - MONGO_URI=mongodb://auth-db:27017/careLog_auth
      - FRONTEND_URL=http://localhost:3000
      - RECORDS_SERVICE_URL=http://records-service:5003
    volumes:
      - /home/andrei-cozma/Desktop/Facultate/IDP/Proiect-IDP/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    secrets:
      - JWT_SECRET
      - MAIL_USER
      - MAIL_PASS
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      carelog-net:
        aliases:
          - auth-service

  # ─── Medical Service (port 5002) ───────────────────────
  medical-service:
    image: carelog-medical-service:latest
    build:
      context: ./medical-service
      dockerfile: Dockerfile
    ports:
      - 5002:5002
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh", "npm", "run", "dev"]
    environment:
      - NODE_ENV=DEV
      - PORT=5002
      - RECORDS_SERVICE_URL=http://records-service:5003
      - IO_SERVICE_URL=http://io-service:5004
      - AUTH_SERVICE_URL=http://auth-service:5001
    volumes:
      - /home/andrei-cozma/Desktop/Facultate/IDP/Proiect-IDP/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    secrets:
      - JWT_SECRET
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      carelog-net:
        aliases:
          - medical-service

  # ─── Records Service (port 5003) ───────────────────────
  records-service:
    image: carelog-records-service:latest
    build:
      context: ./records-service
      dockerfile: Dockerfile
    ports:
      - 5003:5003
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh", "npm", "run", "dev"]
    environment:
      - NODE_ENV=DEV
      - PORT=5003
      - MONGO_URI=mongodb://medical-db:27017/careLog_medical
      - AUTH_MONGO_URI=mongodb://auth-db:27017/careLog_auth
      - IO_SERVICE_URL=http://io-service:5004
    volumes:
      - /home/andrei-cozma/Desktop/Facultate/IDP/Proiect-IDP/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      carelog-net:
        aliases:
          - records-service

  # ─── IO Service (port 5004) ────────────────────────────
  io-service:
    image: carelog-io-service:latest
    build:
      context: ./io-service
      dockerfile: Dockerfile
    ports:
      - 5004:5004
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh", "npm", "run", "dev"]
    environment:
      - NODE_ENV=DEV
      - PORT=5004
    volumes:
      - /home/andrei-cozma/Desktop/Facultate/IDP/Proiect-IDP/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    secrets:
      - AWS_REGION
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_S3_BUCKET_NAME
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      carelog-net:
        aliases:
          - io-service

  # ─── Kong API Gateway ─────────────────────────────────
  kong:
    image: kong:latest
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
        mode: host
      - target: 8443
        published: 8443
        protocol: tcp
        mode: host
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/usr/local/kong/declarative/kong.yml
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_LISTEN=127.0.0.1:8001
    volumes:
      - /home/andrei-cozma/Desktop/Facultate/IDP/Proiect-IDP/kong.yml:/usr/local/kong/declarative/kong.yml
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      carelog-net:
        aliases:
          - kong

  # ─── Portainer (Docker Management) ────────────────────
  portainer:
    image: portainer/portainer-ce:latest
    ports:
      - target: 9000
        published: 9000
        protocol: tcp
        mode: host
      - target: 9443
        published: 9443
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      carelog-net:
        aliases:
          - portainer

  # ─── Databases ─────────────────────────────────────────
  auth-db:
    image: mongo:latest
    ports:
      - 27018:27017
    volumes:
      - auth-dbdata:/data/db
    networks:
      carelog-net:
        aliases:
          - auth-db

  medical-db:
    image: mongo:latest
    ports:
      - 27019:27017
    volumes:
      - medical-dbdata:/data/db
    networks:
      carelog-net:
        aliases:
          - medical-db

networks:
  carelog-net:
    driver: overlay
    attachable: true

volumes:
  auth-dbdata:
  medical-dbdata:
  portainer_data:

secrets:
  JWT_SECRET:
    external: true
  MAIL_USER:
    external: true
  MAIL_PASS:
    external: true
  AWS_REGION:
    external: true
  AWS_ACCESS_KEY_ID:
    external: true
  AWS_SECRET_ACCESS_KEY:
    external: true
  AWS_S3_BUCKET_NAME:
    external: true
