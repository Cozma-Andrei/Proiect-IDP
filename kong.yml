_format_version: "1.1"

services:
  - name: auth-service
    url: http://auth-service:5001
    routes:
      - name: auth-routes
        paths:
          - /auth
          - /confirm
          - /admin
        strip_path: false
  - name: medical-service
    url: http://medical-service:5002
    routes:
      - name: medical-routes
        paths:
          - /patient
          - /doctor
          - /appointment
          - /medicalRecord
          - /prescription
          - /recommendation
          - /document
          - /message
        strip_path: false

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:3000
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
      credentials: true
      max_age: 3600
